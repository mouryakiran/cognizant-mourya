services:
  - type: web
    name: energyiq
    runtime: python
    rootDir: energyiq
    pythonVersion: 3.12
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pip install --no-cache-dir -r requirements.txt && python scripts/generate_data.py --start 2015-01-01 --end 2016-12-31
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT